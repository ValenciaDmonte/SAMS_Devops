apiVersion: v1
kind: Secret
metadata:
  name: sams-secrets
  namespace: sams
type: Opaque
stringData:
  JWT_SECRET: "change-this-to-a-strong-secret"
  GROQ_API_KEY: "your-groq-api-key"
  RESEND_API_KEY: "your-resend-api-key"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "sams"
  DB_USER: "sams_user"
  DB_PASSWORD: "sams_pass"
