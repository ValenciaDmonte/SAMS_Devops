apiVersion: apps/v1
kind: Deployment
metadata:
  name: sams-app
  namespace: sams
  labels:
    app: sams
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sams
  template:
    metadata:
      labels:
        app: sams
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "10000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: sams
        image: valenciadmonte/sams:latest
        ports:
        - containerPort: 10000
        envFrom:
        - secretRef:
            name: sams-secrets
        env:
        - name: PORT
          value: "10000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /
            port: 10000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 10000
          initialDelaySeconds: 30
          periodSeconds: 10
