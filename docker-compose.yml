version: '3.8'

services:

  # Container 1: Nginx (reverse proxy)
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - sams-network

  # Container 2: Node.js Application
  app:
    build: .
    expose:
      - "10000"
    environment:
      PORT: 10000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: sams
      DB_USER: sams_user
      DB_PASSWORD: sams_pass
      JWT_SECRET: ${JWT_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sams-network

  # Container 3: PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sams
      POSTGRES_USER: sams_user
      POSTGRES_PASSWORD: sams_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sams_backup.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sams_user -d sams"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sams-network

networks:
  sams-network:
    driver: bridge

volumes:
  pgdata:
